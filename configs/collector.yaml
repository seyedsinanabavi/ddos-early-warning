# EXAMPLE VALUES — tune on real traffic before production.
version: 1

# Services are logical names; each maps to one or more log sources.
services:
  - name: "public-web"
    type: "nginx"            # nginx | haproxy
    log_paths:
      - "/var/log/nginx/access.log"
    aggregate_interval: "10s"   # 1s | 10s (MVP)
    # Optional: field mapping overrides for non-default nginx log_format.
    # Default assumes combined format.
    nginx_format: "combined"

  - name: "api-edge"
    type: "haproxy"
    log_paths:
      - "/var/log/haproxy/access.log"
    aggregate_interval: "10s"

# Where the collector writes aggregates for the detector to consume.
# File-based MVP store; swap behind the storage interface later.
storage:
  dir: "/var/lib/ddos-ew/store"